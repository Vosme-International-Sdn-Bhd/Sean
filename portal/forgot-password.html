<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Forgot Password — Precision Salon OS</title>
<link rel="stylesheet" href="../assets/styles.css">
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:24px;}
.auth-card{width:100%;max-width:400px;background:#fff;border:0.5px solid var(--border);border-radius:16px;padding:40px 36px;}
.auth-logo{font-size:20px;font-weight:700;color:var(--primary);text-align:center;margin-bottom:4px;}
</style>
</head><body>
<div style="background:#faf9f5;border-bottom:0.5px solid #E2E1DC;padding:8px 24px;"><a href="../index.html" style="font-size:11px;color:#1a5fa8;text-decoration:none;font-family:JetBrains Mono,monospace;letter-spacing:0.02em;">&#8592; Precision Salon OS — GUI Overview</a></div>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">Precision Salon OS</div>
    <div style="text-align:center;font-size:13px;color:var(--text-muted);margin-bottom:28px;">Reset your password</div>

    <div id="step-email">
      <div class="mb-16">
        <label class="field-label">Registered Email Address</label>
        <input type="email" class="input" placeholder="you@example.com">
        <div class="text-xs text-muted mt-4">We'll send a reset link to this email</div>
      </div>
      <button onclick="showSent()" class="btn btn-primary btn-full mb-12">Send Reset Link</button>
      <a href="login.html" class="btn btn-ghost btn-full">← Back to Sign In</a>
    </div>

    <div id="step-sent" style="display:none;text-align:center;">
      <div style="font-size:48px;margin-bottom:16px;">📧</div>
      <div class="font-600 mb-8">Check your email</div>
      <div class="text-sm text-muted mb-20">A password reset link has been sent to your email. The link expires in 30 minutes.</div>
      <a href="login.html" class="btn btn-primary btn-full">Back to Sign In</a>
    </div>
  </div>
</div>
<script>function showSent(){document.getElementById('step-email').style.display='none';document.getElementById('step-sent').style.display='block';}</script>
</body></html>
